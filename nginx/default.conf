server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Zapytania do API (tylko odczyt) lecą do backendu w sieci Dockera. Body zostaje przy domyślnym limicie 1 MB.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Pliki z hashem w nazwie (Vite) można cache'ować bez końca. Brak pliku to 404, nie index.html
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html zawsze rewalidowany: po redeployu przeglądarka nie może trzymać starego HTML-a,
  # który wskazuje na usunięte już /assets/*-<hash>.js (biały ekran)
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Fallback SPA, żeby odświeżenie np. /radar nie dawało 404 (też bez cache, bo to index.html)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}

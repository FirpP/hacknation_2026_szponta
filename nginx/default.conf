# Plik z conf.d jest dołączany w kontekście http, więc map może być tutaj.
# Upgrade dla WebSocketów: przy zwykłym żądaniu Connection zostaje pusty (keep-alive do backendu).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      "";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Domyślnie nginx przyjmuje 1 MB body, zmieniamy na 20 MB
  client_max_body_size 20m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Zapytania do API lecą do backendu w sieci Dockera
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # SSE / streaming: odpowiedź idzie do klienta od razu, bez buforowania; długie połączenia nie są zrywane po 60 s
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Pliki z hashem w nazwie (Vite) można cache'ować bez końca. Brak pliku to 404, nie index.html
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html zawsze rewalidowany: po redeployu przeglądarka nie może trzymać starego HTML-a,
  # który wskazuje na usunięte już /assets/*-<hash>.js (biały ekran)
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Fallback SPA, żeby odświeżenie np. /about nie dawało 404 (też bez cache, bo to index.html)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}

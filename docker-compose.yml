# Dev:        docker compose --profile dev up --build   (logi: docker compose logs -f backend-dev | frontend-dev)
# Produkcja:  docker compose --profile prod up -d --build
#
# Nazwa projektu (prefiks kontenerów i wolumenów) to nazwa katalogu z repo, więc dwa klony templatki
# na jednej maszynie nie dzielą bazy ani kontenerów. Własną nazwę ustawisz w .env: COMPOSE_PROJECT_NAME=moj-projekt

x-app: &app
  env_file:
    - path: .env
      required: false

services:
  # ---------- DEV: backend (:3000) i frontend (:8080) w osobnych kontenerach ----------
  backend-dev:
    <<: *app
    profiles: [dev]
    build:
      context: .
      target: dev-backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
      - "${PRISMA_STUDIO_PORT:-5555}:5555" # bun run dev:prisma:studio
    environment:
      NODE_ENV: development
      DATABASE_URL: file:/app/backend/data/dev.db
      # Harmonogram per profil (environment wygrywa z env_file), żeby jedno ustawienie w .env nie wyłączało produkcji.
      # Dev domyślnie bez harmonogramu, żeby laptop nie wołał źródeł i LLM o 3 w nocy. Włączysz: RADAR_CRON_ENABLED_DEV=true w .env
      RADAR_CRON_ENABLED: ${RADAR_CRON_ENABLED_DEV:-false}
    volumes:
      - ./backend:/app/backend
      - dev_backend_node_modules:/app/backend/node_modules
      # Baza dev w wolumenie, nie w bind mouncie: przy Docker Desktop SQLite (WAL) otwarte jednocześnie z hosta
      # i z kontenera gubi zapisy. Podgląd: bun run dev:prisma:studio lub bun run db:snapshot
      - dev_backend_data:/app/backend/data

  frontend-dev:
    <<: *app
    profiles: [dev]
    build:
      context: .
      target: dev-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    environment:
      VITE_PROXY_TARGET: http://backend-dev:3000
    depends_on:
      - backend-dev
    volumes:
      - ./frontend:/app/frontend
      - dev_frontend_node_modules:/app/frontend/node_modules

  # ---------- PROD: nginx (:80) + backend ----------
  # restart tylko na produkcji - kontenery dev nie wstają same po restarcie laptopa
  backend:
    <<: *app
    profiles: [prod]
    restart: unless-stopped
    build:
      context: .
      target: backend
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/backend/data/prod.db
      # Produkcja domyślnie odświeża bazę sama (codziennie 03:00). Wyłączysz: RADAR_CRON_ENABLED_PROD=false w .env
      RADAR_CRON_ENABLED: ${RADAR_CRON_ENABLED_PROD:-true}
    mem_limit: 512m
    # bun zamiast curl, bo curl może nie być w obrazie oven/bun
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3000/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    volumes:
      - backend_data:/app/backend/data

  web:
    <<: *app
    profiles: [prod]
    restart: unless-stopped
    build:
      context: .
      target: web
    ports:
      - "${APP_PORT:-80}:80"
    mem_limit: 64m
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

# Bez stałego name: - Compose doda prefiks projektu (np. moj-projekt_backend_data)
volumes:
  backend_data:
  dev_backend_data:
  dev_backend_node_modules:
  dev_frontend_node_modules:
